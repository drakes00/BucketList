services:
  pocketbase:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8090:8090"
    volumes:
      - pb_data:/pb/pb_data
      # Keeps schema migrations in the repo — including the ones PocketBase
      # auto-generates when you edit collections in the admin panel.
      - ./backend/pb_migrations:/pb/pb_migrations
      - ./backend/pb_hooks:/pb/pb_hooks
    restart: unless-stopped

volumes:
  pb_data:
